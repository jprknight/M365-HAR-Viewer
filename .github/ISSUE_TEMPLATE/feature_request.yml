name: Feature request
description: Propose a product or investigation-workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the capability without including customer traces, internal
        infrastructure details, credentials, or confidential assessment
        information.
  - type: textarea
    id: problem
    attributes:
      label: Investigation problem
      description: What support-engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security and privacy impact
      options:
        - label: This may change data collection, storage, network communication, telemetry, parsing, rendering, or deployment.
        - label: This may introduce a new dependency or external service.
        - label: No security or privacy boundary change is expected.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
